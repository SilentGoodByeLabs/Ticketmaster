
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketmaster Demo - Book Tickets</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f6f6f6;
            color: #121212;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: #121212;
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            width: 40px;
            height: 40px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .event-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .event-image {
            width: 200px;
            height: 150px;
            background-color: #024ddf;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
        }

        .event-details {
            flex: 1;
        }

        .event-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .event-info {
            color: #646464;
            margin-bottom: 5px;
        }

        .event-price {
            font-size: 20px;
            font-weight: bold;
            color: #024ddf;
            margin-top: 10px;
        }

        .booking-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .booking-modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 8px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #bfbfbf;
            border-radius: 4px;
            font-size: 16px;
        }

        input:focus, select:focus {
            outline: 2px solid #024ddf;
            border-color: #024ddf;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #024ddf;
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: #0139a7;
        }

        .btn-secondary {
            background-color: white;
            color: #121212;
            border: 1px solid #bfbfbf;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #f6f6f6;
        }

        .success-message {
            text-align: center;
            padding: 20px;
        }

        .success-icon {
            font-size: 60px;
            color: #28a745;
            margin-bottom: 20px;
        }

        .ticket-details {
            background-color: #f6f6f6;
            padding: 20px;
            border-radius: 4px;
            margin: 20px 0;
            text-align: left;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: white;
        }

        .close-modal:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo-container">
                <img src="/logo.svg" alt="Logo" class="logo-img">
                <div class="logo-text">Ticketmaster Demo</div>
            </div>
            <nav>
                <a href="demo.html">Events</a>
                <a href="index.html">Original Site</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 style="margin-bottom: 30px;">Upcoming Events</h1>

        <div id="events-container">
            <!-- Events will be added here by JavaScript -->
        </div>
    </div>

    <!-- Booking Modal -->
    <div id="booking-modal" class="booking-modal">
        <button class="close-modal" onclick="closeModal()">&times;</button>
        <div class="modal-content" id="modal-content">
            <!-- Modal content will be added by JavaScript -->
        </div>
    </div>

    <script>
        // Sample events data
        const events = [
            {
                id: 1,
                title: "Rock Concert - The Thunder Band",
                date: "Saturday, June 15, 2026",
                time: "8:00 PM",
                venue: "Madison Square Garden, New York",
                price: 89.99,
                icon: "🎸"
            },
            {
                id: 2,
                title: "Basketball Championship Finals",
                date: "Sunday, July 7, 2026",
                time: "7:30 PM",
                venue: "Staples Center, Los Angeles",
                price: 150.00,
                icon: "🏀"
            },
            {
                id: 3,
                title: "Comedy Show - John Doe Live",
                date: "Friday, August 23, 2026",
                time: "9:00 PM",
                venue: "Comedy Cellar, Las Vegas",
                price: 45.50,
                icon: "😂"
            },
            {
                id: 4,
                title: "Classical Music Symphony",
                date: "Wednesday, September 11, 2026",
                time: "7:00 PM",
                venue: "Carnegie Hall, New York",
                price: 75.00,
                icon: "🎻"
            }
        ];

        // Render events on page load
        document.addEventListener('DOMContentLoaded', () => {
            renderEvents();
        });

        function renderEvents() {
            const container = document.getElementById('events-container');
            container.innerHTML = events.map(event => `
                <div class="event-card" onclick="openBookingModal(${event.id})">
                    <div class="event-image">${event.icon}</div>
                    <div class="event-details">
                        <div class="event-title">${event.title}</div>
                        <div class="event-info">📅 ${event.date} at ${event.time}</div>
                        <div class="event-info">📍 ${event.venue}</div>
                        <div class="event-price">$${event.price.toFixed(2)}</div>
                    </div>
                </div>
            `).join('');
        }

        function openBookingModal(eventId) {
            const event = events.find(e => e.id === eventId);
            const modal = document.getElementById('booking-modal');
            const modalContent = document.getElementById('modal-content');

            modalContent.innerHTML = `
                <div class="modal-title">Book Your Tickets</div>
                <div style="margin-bottom: 20px;">
                    <h3>${event.title}</h3>
                    <p style="color: #646464;">${event.date} at ${event.time}</p>
                    <p style="color: #024ddf; font-weight: bold; font-size: 20px;">$${event.price.toFixed(2)} per ticket</p>
                </div>

                <form id="booking-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="tickets">Number of Tickets</label>
                        <select id="tickets" required>
                            <option value="1">1 Ticket</option>
                            <option value="2">2 Tickets</option>
                            <option value="3">3 Tickets</option>
                            <option value="4">4 Tickets</option>
                            <option value="5">5 Tickets</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="payment">Payment Method (Demo Only)</label>
                        <select id="payment" required>
                            <option value="credit">Credit Card</option>
                            <option value="paypal">PayPal</option>
                            <option value="apple">Apple Pay</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">Complete Booking</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </form>
            `;

            document.getElementById('booking-form').addEventListener('submit', (e) => {
                e.preventDefault();
                processBooking(event);
            });

            modal.classList.add('active');
        }

        function processBooking(event) {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const numTickets = document.getElementById('tickets').value;
            const totalPrice = event.price * numTickets;

            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="success-message">
                    <div class="success-icon">✅</div>
                    <h2 style="margin-bottom: 10px;">Booking Confirmed!</h2>
                    <p style="color: #646464; margin-bottom: 20px;">Thank you, ${name}! Your tickets have been booked successfully.</p>

                    <div class="ticket-details">
                        <h3 style="margin-bottom: 15px;">Ticket Details</h3>
                        <p><strong>Event:</strong> ${event.title}</p>
                        <p><strong>Date:</strong> ${event.date}</p>
                        <p><strong>Time:</strong> ${event.time}</p>
                        <p><strong>Venue:</strong> ${event.venue}</p>
                        <p><strong>Tickets:</strong> ${numTickets}</p>
                        <p><strong>Total:</strong> $${totalPrice.toFixed(2)}</p>
                        <p><strong>Confirmation Email:</strong> ${email}</p>
                    </div>

                    <p style="margin-bottom: 20px; color: #646464;">(This is a demo - no real payment was processed!)</p>

                    <button class="btn btn-primary" onclick="closeModal()">Done</button>
                </div>
            `;
        }

        function closeModal() {
            const modal = document.getElementById('booking-modal');
            modal.classList.remove('active');
        }

        // Close modal when clicking outside content
        document.getElementById('booking-modal').addEventListener('click', (e) => {
            if (e.target.id === 'booking-modal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
